<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo -Classe</title>

    <style>
div{

    background-color: lightpink;
    width: 200px;
    height: 200px;
    text-align: center;
    margin: 10px;


}
/* estlização de passar o mouse */
div:hover{

background-color: green;
font-size: 30px;
}

#quadradovermelho:hover{

    background-color: red;
    font-size: 30px;
}

#quadradoAzul:hover{

    background-color: rgb(9, 9, 221) ;
    font-size: 30px;


}



    </style>
</head>
<body>

    <div>verde</div>
    <div id= "quadradovermelho">VERMELHO</div>
    <div id= "quadradoAzul">AZUL</div>
    
</body>
</html>
