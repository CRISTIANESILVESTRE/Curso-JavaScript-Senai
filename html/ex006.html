<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tabelas</title>
</head>

<body>
    <h1>Trabalhando com tabelas</h1>

    <table border="1">

    <tr>
        <!--table row -são as linhas- São o cabeçalho da tabela--->
        <th>Nome</th>
        <th>Idade</th>
        <th>Estado</th>

    </tr>

    <tr>

       <td>João</td> <!--table data-->
       <td>29</td> 
       <td>SP</td> 


    </tr>

     <tr>

       <td>Maria</td> 
       <td>26</td> 
       <td>RJ</td> 


    </tr>

</table>


</body>
</html>
