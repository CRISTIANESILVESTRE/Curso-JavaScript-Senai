<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listas</title>
</head>
<body>
    <h1>Trabalhando com Listas</h1>

    <h2>Listas ordenadas</h2>
    <ol type="A" Start="5">


        <li>Acordar</li>
        <li>Escovar os dentes</li>
        <li>Tomar Café</li>
        <li>Passear com o cachorro</li>
        <li>Trocar de Roupa</li>
        <li>Ir para o Trabalho</li>
    </ol>

    <h2>Listas não ordenadas</h2>

    <ul type="square">
      <li>Café</li>
      <li>Açucar</li>
      <li>Arroz</li>
      <li>Macarrão</li>
      <li>Suco</li>
      <li>Queijo</li>


    </ul>

    
</body>
</html>
